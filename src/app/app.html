<mat-sidenav-container>
  <mat-sidenav #sidenav>
    <app-menu [sidenav]="sidenav"></app-menu>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar>
      <div class="nav-div">
        <button mat-button (click)="onToggleSidenav(sidenav)" class="menu-toggle-button" color="primary">
          <mat-icon>menu</mat-icon>
        </button>
        <nav>
          <div class="logo">
            <a routerLink="/home">Gyenes méhészet</a>
          </div>

          <div class="nav-middle">
            <a routerLinkActive="active-list-item" routerLink="/home">Főoldal</a>
            <a routerLinkActive="active-list-item" routerLink="/products">Termékek</a>
            @if(!isLoggedIn) {
              <a routerLinkActive="active-list-item" routerLink="/login">Bejelentkezés</a>
              <a routerLinkActive="active-list-item" routerLink="/signup">Regisztráció</a>
          }
          <a routerLinkActive="active-list-item" routerLink="/contact">Kapcsolat</a>
          <a routerLinkActive="active-list-item" routerLink="/orderstatus">Rendelésem</a>
        </div>

          <div class="nav-icons">
            <a routerLinkActive="active-list-item" routerLink="/cart" >
              <mat-icon [matBadge]="cartItemCount$ | async" [matBadgeHidden]="(cartItemCount$ | async) === 0" aria-hidden="false" aria-label="Kosár" fontIcon="shopping_cart"></mat-icon>
            </a>
            <a routerLinkActive="active-list-item" routerLink="/profile">
              <mat-icon aria-hidden="false" aria-label="Profil" fontIcon="person"></mat-icon>
            </a>
            @if (isLoggedIn) {
              <a routerLinkActive="active-list-item" routerLink="/logout" (click)="logout()">
                <mat-icon aria-hidden="false" aria-label="Kijelentkezés" fontIcon="logout"></mat-icon>
              </a>
            }
          </div>
        </nav>

      </div>
    </mat-toolbar>
    <div class="container">
      <router-outlet />
    </div>

  </mat-sidenav-content>
</mat-sidenav-container>
