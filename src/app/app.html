<mat-sidenav-container>
  <mat-sidenav #sidenav>
    <app-menu [sidenav]="sidenav"></app-menu>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar>
        <div class="nav-div">
        <button mat-button (click)="onToggleSidenav(sidenav)" class="menu-toggle-button" color="primary">
          <mat-icon>menu</mat-icon>
        </button>
        <div> Gyenes Méhészet </div>
        <nav>
          <ul>
            <li><a routerLinkActive="active-list-item" routerLink="/home">Főoldal</a></li>
            <li><a routerLinkActive="active-list-item" routerLink="/products">Termékek</a></li>
            <li><a routerLinkActive="active-list-item" routerLink="/cart">Kosár</a></li>
            <li><a routerLinkActive="active-list-item" routerLink="/login">Bejelentkezés</a></li>
            <li><a routerLinkActive="active-list-item" routerLink="/signup">Regisztráció</a></li>
            <li><a routerLinkActive="active-list-item" routerLink="/profile">Profil</a></li>
            <li><a routerLinkActive="active-list-item" routerLink="/contact">Kapcsolat</a></li>
          </ul>
        </nav>
      </div>
      </mat-toolbar>
    <div class="container">
      <router-outlet />
    </div>

  </mat-sidenav-content>
</mat-sidenav-container>
