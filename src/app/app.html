<mat-sidenav-container>
  <mat-sidenav #sidenav>
    <app-menu [sidenav]="sidenav"></app-menu>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar>
      <button mat-button (click)="onToggleSidenav(sidenav)" class="menu-toggle-button">
        <mat-icon>menu</mat-icon>
      </button>
      <div> BioBolt </div>
      <nav>
        <ul>
          <li routerLinkActive="active-list-item"><a routerLink="/home">Főoldal</a></li>
          <li routerLinkActive="active-list-item"><a routerLink="/products">Termékek</a></li>
          <li routerLinkActive="active-list-item"><a routerLink="/cart">Kosár</a></li>
          <li routerLinkActive="active-list-item" class="profile"><a routerLink="/profile">Profil</a></li>
        </ul>
      </nav>
    </mat-toolbar>
    <div class="container">
      <router-outlet />
    </div>

  </mat-sidenav-content>
</mat-sidenav-container>
