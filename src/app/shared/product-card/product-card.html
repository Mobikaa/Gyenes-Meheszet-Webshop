<mat-card class="example-card" appearance="outlined">
    <mat-card-header>
        <!-- <img mat-card-image [src]="product.picture" [alt]="product.name"> -->
        <mat-card-title>{{product.name}}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <p>
            {{product.description}}
        </p>
        <p class="price">
            {{product.price | numberSpacer}} Ft
        </p>
    </mat-card-content>
    <mat-card-actions>
        <button matButton="filled" (click)="addToCart()">Kosárba</button>
    </mat-card-actions>
    <mat-card-subtitle>{{product.category}}</mat-card-subtitle>
</mat-card>
