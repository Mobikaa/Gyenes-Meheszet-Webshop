<div class="page-container">
    <form>
        <div class="form-content">
            <mat-form-field class="form-item">
                <mat-label>E-mail cím</mat-label>
                <input type="email" matInput placeholder="pelda@email.com">
            </mat-form-field>

            <mat-form-field class="form-item">
                <mat-label>E-mail cím megerősítés</mat-label>
                <input type="email" matInput placeholder="pelda@email.com">
            </mat-form-field>

            <mat-form-field class="form-item">
                <mat-label>Jelszó</mat-label>
                <input type="password" matInput>
            </mat-form-field>

            <mat-form-field class="form-item">
                <mat-label>Jelszó megerősítés</mat-label>
                <input type="password" matInput>
            </mat-form-field>

            <button matButton="filled" class="form-button">Regisztráció</button>

            <p class="login-navigation">Van már fiókod? <a [routerLink]="['/login']">Lépj be itt!</a></p>
        </div>
    </form>
</div>
