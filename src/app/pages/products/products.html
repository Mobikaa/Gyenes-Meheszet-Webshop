<div class="page-container">
    <div class="header">
        <h1>Termékeink</h1>
        <p>Tekintse meg prémium kínálatunkat</p>
    </div>
    <div class="content">
        @for(product of products; track product.id){
            <app-product-card [product]="product"></app-product-card>
        }

        @if(products.length != totalProducts){
            @if(loading){
                <mat-spinner></mat-spinner>
            }
            @else{
                <button matButton="filled" (click)="loadMore()">Több betöltése</button>
            }

        }
    </div>
</div>
